<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Ride - Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1>Recuperar Contraseña</h1>
    <p class="subtitle">Ingresa tu correo institucional y te enviaremos un enlace para restablecer tu contraseña.</p>

    <form id="formSolicitar">
        <div class="form-group">
            <label for="emailRecup">Correo Institucional</label>
            <input type="email" id="emailRecup" placeholder="usuario@uta.edu.ec" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btnSolicitar">Enviar Enlace</button>
        <div id="msgSolicitar" class="msg"></div>
    </form>

    <hr class="divider">
    <p class="auth-footer"><a href="index.html">← Volver al inicio de sesión</a></p>
</div>

<script type="module">
    import { solicitarRecuperacion } from '../Persistence/supabaseClient.js';

    const form = document.getElementById('formSolicitar');
    const btn  = document.getElementById('btnSolicitar');
    const msg  = document.getElementById('msgSolicitar');

    function mostrar(texto, tipo) {
        msg.textContent = texto;
        msg.className   = `msg show msg-${tipo}`;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.textContent = 'Enviando...';
        btn.disabled    = true;
        msg.className   = 'msg';

        try {
            await solicitarRecuperacion(document.getElementById('emailRecup').value);
            mostrar('✅ Enlace enviado. Revisa tu correo @uta.edu.ec y haz click en el enlace para restablecer tu contraseña.', 'success');
            btn.textContent = 'Enviado ✓';
        } catch (err) {
            mostrar(err.message, 'error');
            btn.textContent = 'Enviar Enlace';
            btn.disabled    = false;
        }
    });
</script>

</body>
</html>
