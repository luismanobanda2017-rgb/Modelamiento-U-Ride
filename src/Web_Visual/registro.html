<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Ride - Registro de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-card" style="max-width:500px;">
    <div class="auth-logo">🚗</div>
    <h1>Registro de Usuario</h1>
    <p class="subtitle">Crea tu cuenta en U-Ride · Solo correos @uta.edu.ec</p>
    <div class="badge-verificado" style="justify-content:center;margin-bottom:16px;">Pasajero / Conductor</div>
    <p style="font-size:12px;color:var(--texto-gris);margin:-6px 0 16px;">Te registras como estudiante UTA. Luego puedes usar el modo pasajero o conductor desde tu perfil.</p>
    <input type="hidden" id="rolSeleccionado" value="pasajero">

    <form id="formRegistro">
        <div class="form-group">
            <label for="nombre">Nombre Completo *</label>
            <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Institucional *</label>
            <input type="email" id="email" placeholder="usuario@uta.edu.ec" required autocomplete="email">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="matricula">Matrícula estudiantil (opcional)</label>
                <input type="text" id="matricula" placeholder="20210001">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono (opcional)</label>
                <input type="tel" id="telefono" placeholder="+593 99 000 0000">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="carrera">Carrera (opcional)</label>
                <input type="text" id="carrera" placeholder="Ej: Ingeniería en Sistemas">
            </div>
            <div class="form-group">
                <label for="zona">Zona / Barrio (opcional)</label>
                <input type="text" id="zona" placeholder="Ej: Zona Norte">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="placa">Placa del vehículo (opcional)</label>
                <input type="text" id="placa" placeholder="Ej: ABC-1234">
            </div>
            <div class="form-group">
                <label for="modeloVehiculo">Marca y modelo (vehículo) opcional</label>
                <input type="text" id="modeloVehiculo" placeholder="Ej: Chevrolet Sail">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmar">Confirmar Contraseña *</label>
                <input type="password" id="confirmar" placeholder="Repite la contraseña" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btnRegistrar">Crear Cuenta</button>
        <div id="msgRegistro" class="msg"></div>
    </form>

    <hr class="divider">
    <p class="auth-footer">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
</div>

<script type="module">
    import { registrarUsuario } from '../Persistence/supabaseClient.js';
    const rolInput = document.getElementById('rolSeleccionado');
    const form = document.getElementById('formRegistro');
    const btn  = document.getElementById('btnRegistrar');
    const msg  = document.getElementById('msgRegistro');

    function mostrar(texto, tipo) {
        msg.textContent = texto;
        msg.className   = `msg show msg-${tipo}`;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const password  = document.getElementById('password').value;
        const confirmar = document.getElementById('confirmar').value;

        if (password !== confirmar) {
            mostrar('Las contraseñas no coinciden.', 'error');
            return;
        }

        btn.textContent = 'Creando cuenta...';
        btn.disabled    = true;
        msg.className   = 'msg';

        try {
            await registrarUsuario({
                nombre:    document.getElementById('nombre').value,
                email:     document.getElementById('email').value,
                password,
                rol:       rolInput.value,
                telefono:  document.getElementById('telefono').value,
                carrera:   document.getElementById('carrera').value,
                zona:      document.getElementById('zona').value,
                matricula: document.getElementById('matricula').value,
                placa:     document.getElementById('placa').value,
                modeloVehiculo: document.getElementById('modeloVehiculo').value
            });

            mostrar('✓ Cuenta creada. Revisa tu correo @uta.edu.ec — te enviamos un link de verificación.', 'success');

            // Limpiar formulario
            form.reset();
            rolInput.value = 'pasajero';
        } catch (err) {
            mostrar(err.message, 'error');
            btn.textContent = 'Crear Cuenta';
            btn.disabled    = false;
        }
    });
</script>

</body>
</html>
