<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-Ride - Nueva Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-logo">🔑</div>
    <h1>Nueva Contraseña</h1>
    <p class="subtitle">Ingresa tu nueva contraseña para U-Ride.</p>

    <div id="cargando" class="msg msg-info show">Verificando enlace...</div>

    <form id="formNuevaPass" style="display:none;">
        <div class="form-group">
            <label for="nuevaPass">Nueva Contraseña</label>
            <input type="password" id="nuevaPass" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirmarPass">Confirmar Contraseña</label>
            <input type="password" id="confirmarPass" placeholder="Repite la contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btnActualizar">Actualizar Contraseña</button>
        <div id="msgNuevaPass" class="msg"></div>
    </form>

    <hr class="divider">
    <p class="auth-footer"><a href="index.html">← Volver al inicio de sesión</a></p>
</div>

<script type="module">
    import { supabase, actualizarPassword } from '../Persistence/supabaseClient.js';

    const cargando = document.getElementById('cargando');
    const form     = document.getElementById('formNuevaPass');
    const btn      = document.getElementById('btnActualizar');
    const msg      = document.getElementById('msgNuevaPass');

    function mostrar(texto, tipo) {
        msg.textContent = texto;
        msg.className   = `msg show msg-${tipo}`;
    }

    // Supabase maneja el token del link automaticamente via onAuthStateChange
    supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
            // El usuario llego desde el link del correo — mostrar formulario
            cargando.style.display = 'none';
            form.style.display     = 'block';
        } else if (event === 'SIGNED_IN' && session) {
            // Ya autenticado, mostrar formulario igual
            cargando.style.display = 'none';
            form.style.display     = 'block';
        }
    });

    // Si despues de 3 segundos no hay evento, mostrar error
    setTimeout(() => {
        if (form.style.display === 'none') {
            cargando.textContent = '❌ Enlace inválido o expirado. Solicita uno nuevo.';
            cargando.className   = 'msg show msg-error';
        }
    }, 3000);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nueva     = document.getElementById('nuevaPass').value;
        const confirmar = document.getElementById('confirmarPass').value;

        if (nueva !== confirmar) {
            mostrar('Las contraseñas no coinciden.', 'error');
            return;
        }

        btn.textContent = 'Actualizando...';
        btn.disabled    = true;

        try {
            await actualizarPassword(nueva);
            mostrar('✅ Contraseña actualizada. Redirigiendo...', 'success');
            setTimeout(() => window.location.href = 'index.html', 2000);
        } catch (err) {
            mostrar(err.message, 'error');
            btn.textContent = 'Actualizar Contraseña';
            btn.disabled    = false;
        }
    });
</script>

</body>
</html>
